[project]
name = "veo-analyzer"
version = "0.1.1"
description = "Local-first basketball highlight chapters for Veo recordings"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "jinja2==3.1.6",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
